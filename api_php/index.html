<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Front básico — API Productos</title>
  <style>
    body { font-family: system-ui, Arial; margin: 24px; }
    input { width: 100%; padding: 10px; }
    button { padding: 10px 14px; margin-top: 10px; }
    .ok { color: #0a7; font-weight: 700; }
    .bad { color: #c00; font-weight: 700; }
    pre { background:#f6f6f6; padding:12px; border-radius:10px; overflow:auto; }
    table { width:100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border:1px solid #ccc; padding: 8px; text-align:left; }
  </style>
</head>
<body>
  <h1>Front básico — API Productos</h1>

  <label>URL endpoint:</label>
  <input id="apiUrl" value="http://localhost/api_php/api_productos.php">

  <button id="btnGet">GET / productos</button>

  <p id="mensaje"></p>
  <pre id="raw"></pre>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>Nombre</th><th>Código barras</th><th>Código</th>
        <th>PVP</th><th>Caducidad</th><th>Actualizado</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

  <script src="app.js"></script>

</html>
