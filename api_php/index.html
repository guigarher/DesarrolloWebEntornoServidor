<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba API Productos (PHP + JSON)</title>
</head>
<body>
  <h1>Productos</h1>

  <section>
    <h2>Listado de productos</h2>
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Código barras</th>
          <th>Código interno</th>
          <th>PVP</th>
          <th>Fecha caducidad</th>
          <th>Actualizado</th>
        </tr>
      </thead>
      <tbody id="tbody-productos">
      </tbody>
    </table>
  </section>

  <section>
    <h2>Datos en formato JSON</h2>
    <pre id="json-productos"></pre>
  </section>

  <section>
    <h2>Crear nuevo producto</h2>
    <form id="form-producto">
      <div>
        <label>
          Nombre 
          <input type="text" id="nombre" required>
        </label>
      </div>
      <div>
        <label>
          Código de barras
          <input type="text" id="codigoBarras">
        </label>
      </div>
      <div>
        <label>
          Código interno
          <input type="text" id="codigo">
        </label>
      </div>
      <div>
        <label>
          PVP 
          <input type="number" step="0.01" id="pvp" required>
        </label>
      </div>
      <div>
        <label>
          Fecha de caducidad
          <input type="date" id="fechaCaducidad">
        </label>
      </div>
      <button type="submit">Guardar producto</button>
    </form>
  </section>

  <pre id="mensajes"></pre>

  <script src="app.js"></script>
</body>
</html>
