<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stress test — API Productos</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:24px;line-height:1.3}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1000px}
    @media (max-width:900px){.row{grid-template-columns:1fr}}
    label{display:block;margin:10px 0 6px;font-size:14px}
    input{width:100%;padding:10px;box-sizing:border-box}
    button{padding:10px 14px;cursor:pointer}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .card{border:1px solid #ddd;border-radius:10px;padding:14px}
    pre{background:#f7f7f7;padding:12px;border-radius:10px;overflow:auto}
    .ok{color:#0a7;font-weight:700}
    .bad{color:#c00;font-weight:700}
    .muted{color:#666;font-size:13px}
  </style>
</head>
<body>
  <h1>Stress test — API Productos</h1>
  <p class="muted">
    Esto lanza muchas peticiones y resume resultados. Sirve para demostrar manejo de errores (HTTP, no-JSON, timeouts, red).
  </p>

  <div class="card">
    <div class="toolbar">
      <div style="flex:1;min-width:340px">
        <label>URL correcta (endpoint real)</label>
        <input id="urlOk" value="http://localhost/api_php/api_productos.php">
      </div>
      <div style="flex:1;min-width:340px">
        <label>URL mala (para provocar 404 HTML)</label>
        <input id="urlBad" value="http://localhost/api_php/api_productos_NOEXISTE.php">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Total peticiones</label>
        <input id="total" type="number" value="2000" min="1" step="1">
      </div>
      <div>
        <label>Concurrencia (cuántas a la vez)</label>
        <input id="conc" type="number" value="50" min="1" step="1">
      </div>
      <div>
        <label>% de peticiones a URL mala (0-100)</label>
        <input id="pctBad" type="number" value="10" min="0" max="100" step="1">
      </div>
      <div>
        <label>Timeout cliente (ms) (para forzar TIMEOUT)</label>
        <input id="timeoutMs" type="number" value="1200" min="0" step="100">
      </div>
    </div>

    <div class="toolbar" style="margin-top:12px">
      <button id="btnRun">Ejecutar</button>
      <button id="btnStop">Parar</button>
      <span id="estado" class="ok"></span>
    </div>
  </div>

  <div class="row" style="margin-top:14px">
    <div class="card">
      <h2 style="margin-top:0">Resumen</h2>
      <pre id="out">{}</pre>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Últimos errores (muestra)</h2>
      <pre id="errors">[]</pre>
    </div>
  </div>

<script>
  function $(id){ return document.getElementById(id); }

  let running = false;

  function nowMs(){ return Date.now(); }

  function pickUrl(urlOk, urlBad, pctBad){
    const r = Math.random() * 100;
    return (r < pctBad) ? urlBad : urlOk;
  }

  async function fetchWithTimeout(url, timeoutMs){
    const controller = new AbortController();
    let t = null;

    if (timeoutMs > 0){
      t = setTimeout(() => controller.abort(), timeoutMs);
    }

    try{
      const res = await fetch(url, { signal: controller.signal });

      // Intentar JSON: si es HTML (404 Apache) esto falla y lo marcamos NON_JSON
      let data = null;
      let nonJson = false;
      try{
        data = await res.json();
      }catch{
        nonJson = true;
        data = { ok:false, error:"Respuesta NO JSON (probable HTML del servidor)", code:"NON_JSON", httpStatus: res.status };
      }

      return { kind:"HTTP", status: res.status, ok: res.ok, nonJson, data };
    }catch(e){
      if (e.name === "AbortError"){
        return { kind:"TIMEOUT", status: 0, ok:false, nonJson:false, data:{ ok:false, error:"Timeout cliente (AbortController)", code:"TIMEOUT" } };
      }
      return { kind:"FETCH_FAILED", status: 0, ok:false, nonJson:false, data:{ ok:false, error:"No se pudo conectar (URL/servidor/CORS)", code:"FETCH_FAILED" } };
    }finally{
      if (t) clearTimeout(t);
    }
  }

  function inc(map, key){
    map[key] = (map[key] || 0) + 1;
  }

  function pushErrorSample(arr, obj, max=12){
    if (arr.length < max) arr.push(obj);
  }

  async function run(){
    running = true;
    $("estado").className = "ok";
    $("estado").textContent = "Ejecutando…";

    const urlOk = $("urlOk").value.trim();
    const urlBad = $("urlBad").value.trim();
    const total = Math.max(1, parseInt($("total").value, 10) || 1);
    const conc  = Math.max(1, parseInt($("conc").value, 10) || 1);
    const pctBad = Math.min(100, Math.max(0, parseInt($("pctBad").value, 10) || 0));
    const timeoutMs = Math.max(0, parseInt($("timeoutMs").value, 10) || 0);

    const stats = {
      start: nowMs(),
      total,
      conc,
      pctBad,
      timeoutMs,
      done: 0,
      byStatus: {},
      nonJson: 0,
      timeouts: 0,
      fetchFailed: 0,
      apiOk: 0,        // res.ok && data.ok
      apiError: 0      // res.ok && data.ok == false (tu API devolvió ok:false)
    };

    const samples = [];

    // cola simple
    let next = 0;

    async function worker(){
      while(running && next < total){
        const i = next++;
        const url = pickUrl(urlOk, urlBad, pctBad);

        const r = await fetchWithTimeout(url, timeoutMs);

        stats.done++;

        if (r.kind === "TIMEOUT"){
          stats.timeouts++;
          inc(stats.byStatus, "TIMEOUT");
          pushErrorSample(samples, { i, url, code:"TIMEOUT", detail:r.data.error });
        } else if (r.kind === "FETCH_FAILED"){
          stats.fetchFailed++;
          inc(stats.byStatus, "FETCH_FAILED");
          pushErrorSample(samples, { i, url, code:"FETCH_FAILED", detail:r.data.error });
        } else {
          // HTTP
          inc(stats.byStatus, String(r.status));

          if (r.nonJson){
            stats.nonJson++;
            pushErrorSample(samples, { i, url, httpStatus:r.status, code:"NON_JSON", detail:r.data.error });
          } else {
            // JSON válido
            // Si es tu API, normalmente devuelve {ok:true/false,...}
            if (r.ok && r.data && r.data.ok === true) stats.apiOk++;
            if (r.ok && r.data && r.data.ok === false) {
              stats.apiError++;
              pushErrorSample(samples, { i, url, httpStatus:r.status, code:r.data.code, detail:r.data.error });
            }
            if (!r.ok){
              // HTTP error con JSON (por ejemplo tu 404 NOT_FOUND de producto)
              pushErrorSample(samples, { i, url, httpStatus:r.status, code:r.data?.code, detail:r.data?.error });
            }
          }
        }

        // refresco UI cada 50
        if (stats.done % 50 === 0 || stats.done === total){
          const elapsed = nowMs() - stats.start;
          $("out").textContent = JSON.stringify({ ...stats, elapsedMs: elapsed }, null, 2);
          $("errors").textContent = JSON.stringify(samples, null, 2);
        }
      }
    }

    const workers = [];
    for(let k=0; k<conc; k++) workers.push(worker());
    await Promise.all(workers);

    const elapsed = nowMs() - stats.start;
    $("out").textContent = JSON.stringify({ ...stats, elapsedMs: elapsed }, null, 2);
    $("errors").textContent = JSON.stringify(samples, null, 2);

    if (!running){
      $("estado").className = "bad";
      $("estado").textContent = "Parado por el usuario";
    }else{
      $("estado").className = "ok";
      $("estado").textContent = "Terminado ✅";
    }

    running = false;
  }

  $("btnRun").addEventListener("click", () => {
    if (running) return;
    $("out").textContent = "{}";
    $("errors").textContent = "[]";
    run();
  });

  $("btnStop").addEventListener("click", () => {
    running = false;
  });
</script>
</body>
</html>
